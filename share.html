<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Link Undangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-stone-950 via-stone-900 to-stone-950 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white/85 backdrop-blur-md border border-champagne-400/20 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-3 mb-4">
                    <div class="h-px w-12 bg-gradient-to-r from-transparent to-champane-400"></div>
                    <i class="fa-solid fa-link text-champagne-400 text-sm"></i>
                    <div class="h-px w-12 bg-gradient-to-l from-transparent to-champane-400"></div>
                </div>
                <h1 class="font-serif text-3xl text-champagne-200 mb-1">Buat Link Undangan</h1>
                <p class="text-xs text-stone-700 tracking-wider">Generator tautan personal untuk tamu</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] text-champagne-300 uppercase tracking-widest font-semibold mb-2" for="toName">
                        <i class="fa-solid fa-user mr-1"></i> Kepada
                    </label>
                    <input type="text" id="toName" placeholder="Contoh: Andri Januardi, S.Kom"
                        class="w-full px-4 py-3 rounded-xl border border-champagne-400/20  text-champagne-100 placeholder-stone-500 focus:outline-none focus:ring-2 focus:ring-champagne-500 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-[10px] text-champagne-300 uppercase tracking-widest font-semibold mb-2" for="diLoc">
                        <i class="fa-solid fa-location-dot mr-1"></i> Di
                    </label>
                    <input type="text" id="diLoc" value="Sinabang"
                        class="w-full px-4 py-3 rounded-xl border border-champagne-400/20  text-champagne-100 placeholder-stone-500 focus:outline-none focus:ring-2 focus:ring-champagne-500 focus:border-transparent text-sm transition">
                </div>

                <button onclick="generateLink()"
                    class="w-full py-3.5 bg-gradient-to-r from-champagne-600 to-champagne-700 hover:from-champagne-700 hover:to-champagne-800 text-white rounded-xl font-semibold shadow-lg shadow-champagne-600/30 transition duration-300 flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i> Salin Link
                </button>
            </div>

            <div id="resultBox" class="mt-2 hidden">
                <button onclick="openLink()" class="w-full py-3.5 bg-gradient-to-r from-champagne-600 to-champagne-700 hover:from-champagne-700 hover:to-champagne-800 text-white rounded-xl font-semibold shadow-lg shadow-champagne-600/30 transition duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i> Buka Link
                </button>
                <div class="bg-stone-800/10 border border-champagne-400/20 rounded-xl p-4 mt-6">
                    <div class="flex items-start gap-3">
                        <i class="fa-solid fa-link text-champagne-400 mt-1"></i>
                        <div class="flex-1 min-w-0">
                            <p class="text-[10px] text-champagne-300 uppercase tracking-widest font-semibold mb-1">Link Undangan</p>
                            <p id="linkOutput" class="text-xs text-champagne-100 break-all"></p>
                        </div>
                    </div>
                </div>
            </div>

            <p class="text-[10px] text-stone-700 text-center mt-6 tracking-wider">
                Klik tombol untuk menyalin link ke clipboard
            </p>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-900 text-white border border-champagne-400 px-6 py-3 rounded-full shadow-2xl z-50 hidden transition-all duration-500 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-champagne-400"></i>
        <span id="toastText" class="text-xs font-semibold">Link berhasil disalin!</span>
    </div>

    <script>

        function openLink() {
            const name = document.getElementById('toName').value.trim();
            const location = document.getElementById('diLoc').value.trim() || 'Sinabang';

            const baseUrl = window.location.origin + window.location.pathname.replace('share.html', '');
            const link = baseUrl + 'index.html?to=' + encodeURIComponent(name) + '&di=' + encodeURIComponent(location);

            window.location.href = link
        }

        function generateLink() {
            const name = document.getElementById('toName').value.trim();
            const location = document.getElementById('diLoc').value.trim() || 'Sinabang';

            if (!name) {
                showToast('Silakan isi nama tamu terlebih dahulu!');
                return;
            }

            const baseUrl = window.location.origin + window.location.pathname.replace('share.html', '');
            const link = baseUrl + 'index.html?to=' + encodeURIComponent(name) + '&di=' + encodeURIComponent(location);

            const linkOutput = document.getElementById('linkOutput');
            linkOutput.textContent = link;

            const resultBox = document.getElementById('resultBox');
            resultBox.classList.remove('hidden');

            copyToClipboard(link);
        }

        function copyToClipboard(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            temp.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast('Link undangan berhasil disalin!');
            } catch (err) {
                showToast('Gagal menyalin link.');
            }
            document.body.removeChild(temp);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            toastText.textContent = msg;
            toast.classList.remove('hidden');
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateY(24px)';
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 500);
            }, 2500);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') generateLink();
        });
    </script>
</body>
</html>
